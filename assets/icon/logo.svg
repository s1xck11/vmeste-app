<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент колец (пудровый) -->
    <linearGradient id="dustyRings" x1="200" y1="200" x2="824" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B8C4"/>
      <stop offset="100%" stop-color="#D19A9E"/>
    </linearGradient>
    
    <!-- Фон -->
    <linearGradient id="bgDiag" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1A1B"/>
      <stop offset="100%" stop-color="#0E0C0D"/>
    </linearGradient>

    <!-- Фильтр мягкого свечения -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Маска для переплетения (одно кольцо поверх другого) -->
    <mask id="weave">
      <rect width="100%" height="100%" fill="white" />
      <path d="M 512 342 A 170 170 0 0 1 512 682" stroke="black" stroke-width="64" fill="none" />
    </mask>
  </defs>
  
  <!-- Темный фон -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgDiag)"/>
  
  <!-- Обертка для свечения -->
  <g filter="url(#glow)">
    <g transform="rotate(-30 512 512)">
      <!-- Левое кольцо -->
      <circle cx="430" cy="512" r="170" stroke="url(#dustyRings)" stroke-width="64" />
      <!-- Правое кольцо с маской -->
      <circle cx="594" cy="512" r="170" stroke="url(#dustyRings)" stroke-width="64" mask="url(#weave)" />
    </g>
  </g>
</svg>