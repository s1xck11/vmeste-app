name: vmeste_tv
description: Вместе ТВ — лаунчер для телевизора на Windows (задачи, покупки, смены, бюджет)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Данные и синк — версии как в мобильном main
  supabase_flutter: ^2.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  connectivity_plus: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.1

  # Геймпад через XInput (dart:ffi)
  ffi: ^2.1.0

  # Окно лаунчера: fullscreen-киоск (0.3.9 — под Flutter 3.22)
  window_manager: 0.3.9

  # Edge внутри лаунчера (WebView2)
  webview_windows: 0.4.0

  # Открытие ссылок во внешнем браузере
  url_launcher: ^6.3.0

  # Обои: выбор файла картинки
  file_picker: 8.0.7

  # Звуки интерфейса
  audioplayers: 6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
