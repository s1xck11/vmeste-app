name: vmeste_app
description: Приложение для пар — покупки, задачи, смены, бюджет
publish_to: 'none'
version: 1.1.0+100

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  open_filex: ^4.4.0
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFF5F8"
  adaptive_icon_foreground: "assets/icon/app_icon.png"