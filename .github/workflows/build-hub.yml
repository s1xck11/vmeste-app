name: Build Hub APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      
      - name: Set version from run number
        run: |
          NEW_VERSION="1.0.${{ github.run_number }}"
          sed -i "s|^version: .*|version: $NEW_VERSION+${{ github.run_number }}|" pubspec.yaml
          echo "=== pubspec version ==="
          grep "^version:" pubspec.yaml
      
      - name: Create Android project files
        run: flutter create --org com.vmeste --project-name vmeste_hub --platforms android --no-pub .
      
      - name: Restore root build.gradle
        run: cp .github/build.gradle.root.template android/build.gradle
      
      - name: Restore settings.gradle
        run: cp .github/settings.gradle.template android/settings.gradle
      
      - name: Restore app build.gradle
        run: cp .github/build.gradle.template android/app/build.gradle
      
      - name: Restore gradle-wrapper.properties
        run: cp .github/gradle-wrapper.properties.template android/gradle/wrapper/gradle-wrapper.properties
      
      - name: Restore MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/vmeste/vmeste_hub
          cat > android/app/src/main/kotlin/com/vmeste/vmeste_hub/MainActivity.kt <<'EOF'
          package com.vmeste.vmeste_hub
          
          import io.flutter.embedding.android.FlutterActivity
          
          class MainActivity: FlutterActivity() {
          }
          EOF
      
      - name: Restore AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.REORDER_TASKS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
          
              <application
                  android:label="Вместе Хаб"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/LaunchTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <!-- ЭТО ДЕЛАЕТ ХАБ КАНДИДАТОМ НА ДОМАШНИЙ ЭКРАН -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF
      
      - name: Restore styles.xml
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Тема для запуска: белый фон, чтобы не было черного экрана на Android 12 -->
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
              <!-- Основная тема -->
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF
      
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate launcher icons
        run: |
          if [ -f "assets/icon/app_icon.png" ]; then
            flutter pub run flutter_launcher_icons
          else
            echo "⚠️ Нет assets/icon/app_icon.png — пропускаю"
          fi
      
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      
      - name: Rename APKs
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/vmeste-hub-armeabi-v7a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/vmeste-hub-arm64-v8a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/vmeste-hub-x86_64.apk 2>/dev/null || true
          ls -la release/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vmeste-hub-apk
          path: hub/release/*.apk
          retention-days: 30
      
      - name: Get short sha
        id: short_sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Create Release
        if: github.ref == 'refs/heads/hub'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hub-v1.0.${{ github.run_number }}
          name: Вместе Хаб 1.0.${{ github.run_number }} (${{ steps.short_sha.outputs.SHA }})
          files: hub/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}