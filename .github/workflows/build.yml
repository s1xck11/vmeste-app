name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      
      - name: Create Android project files
        run: flutter create --org com.vmeste --project-name vmeste_app .
      
      - name: Add INTERNET permission to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "✅ INTERNET уже есть"
          else
            sed -i 's|<manifest \(.*\)>|<manifest \1>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>|' "$MANIFEST"
          fi
      
      - name: Set app name to Вместе
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|android:label="vmeste_app"|android:label="Вместе"|' "$MANIFEST"
          echo "=== Манифест после правок ==="
          cat "$MANIFEST"
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate launcher icons
        run: |
          if [ -f "assets/icon/app_icon.png" ]; then
            echo "🎨 Генерирую иконки..."
            flutter pub run flutter_launcher_icons
          else
            echo "⚠️ Нет assets/icon/app_icon.png — пропускаю генерацию иконок"
          fi
      
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      
      - name: Rename APKs
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/vmeste-armeabi-v7a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/vmeste-arm64-v8a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/vmeste-x86_64.apk 2>/dev/null || true
          ls -la release/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vmeste-apk
          path: release/*.apk
          retention-days: 30
      
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}