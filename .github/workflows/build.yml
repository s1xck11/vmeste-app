- name: Install widget Kotlin provider
  run: |
    mkdir -p android/app/src/main/kotlin/com/vmeste/vmeste_app
    cp .github/vmeste_widget_provider.kt.template \
       android/app/src/main/kotlin/com/vmeste/vmeste_app/VmesteWidgetProvider.kt

- name: Install widget layouts
  run: |
    mkdir -p android/app/src/main/res/layout
    mkdir -p android/app/src/main/res/drawable
    cp .github/widget_shifts.xml.template    android/app/src/main/res/layout/widget_shifts.xml
    cp .github/widget_purchases.xml.template android/app/src/main/res/layout/widget_purchases.xml
    cp .github/widget_tasks.xml.template     android/app/src/main/res/layout/widget_tasks.xml
    cp .github/widget_bg.xml.template        android/app/src/main/res/drawable/widget_bg.xml

- name: Install widget xml metadata
  run: |
    mkdir -p android/app/src/main/res/xml
    cp .github/widget_shifts_info.xml.template    android/app/src/main/res/xml/widget_shifts_info.xml
    cp .github/widget_purchases_info.xml.template android/app/src/main/res/xml/widget_purchases_info.xml
    cp .github/widget_tasks_info.xml.template     android/app/src/main/res/xml/widget_tasks_info.xml

- name: Inject widget receivers into AndroidManifest
  run: |
    python3 - <<'PY'
    import pathlib
    p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
    s = p.read_text()
    block = """
        <!-- ============ ВИДЖЕТЫ ============ -->
        <receiver android:name=".VmesteShiftsWidget" android:exported="true" android:label="Вместе · Смены">
            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
            <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_shifts_info" />
        </receiver>
        <receiver android:name=".VmestePurchasesWidget" android:exported="true" android:label="Вместе · Покупки">
            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
            <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_purchases_info" />
        </receiver>
        <receiver android:name=".VmesteTasksWidget" android:exported="true" android:label="Вместе · Задачи">
            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
            <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_tasks_info" />
        </receiver>
    """
    s = s.replace('</application>', block + '    </application>')
    p.write_text(s)
    PY
    echo "=== манифест после инъекции ==="
    grep -A2 "VmesteShiftsWidget" android/app/src/main/AndroidManifest.xml || true