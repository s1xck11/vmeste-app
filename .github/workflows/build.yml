name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      
      - name: Create Android project files
        run: flutter create --org com.vmeste --project-name vmeste_app .
      
      - name: Add permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== Перед ==="
          cat "$MANIFEST"
          
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<manifest \(.*\)>|<manifest \1>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>|' "$MANIFEST"
          fi
          
          if ! grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"; then
            sed -i 's|<manifest \(.*\)>|<manifest \1>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>|' "$MANIFEST"
          fi
          
          if ! grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$MANIFEST"; then
            sed -i 's|<manifest \(.*\)>|<manifest \1>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>|' "$MANIFEST"
          fi
          
          echo "=== После ==="
          cat "$MANIFEST"
      
      - name: Set app name to Вместе
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|android:label="vmeste_app"|android:label="Вместе"|' "$MANIFEST"
          echo "=== Манифест после правок ==="
          cat "$MANIFEST"
      
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
      
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF
          echo "=== key.properties ==="
          cat android/key.properties
      
      - name: Patch build.gradle for signing
        run: |
          GRADLE="android/app/build.gradle"
          echo "=== Исходный build.gradle (верх) ==="
          head -20 "$GRADLE"
          
          # Добавляем загрузку key.properties и signingConfigs перед блоком android {
          python3 - <<'PYEOF'
          import re
          
          path = "android/app/build.gradle"
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Если уже пропатчен — не дублируем
          if "keystoreProperties" in content:
              print("Уже пропатчен, пропускаю")
          else:
              # Загружаем key.properties
              load_block = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          
          '''
              content = load_block + content
          
              # Внутри android { ... } добавляем signingConfigs
              signing_block = '''    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
              # Находим "android {" и вставляем после него
              idx = content.find("android {")
              if idx != -1:
                  insert_at = idx + len("android {")
                  content = content[:insert_at] + "\n" + signing_block + content[insert_at:]
          
              # Заменяем buildTypes.release на подписанную
              content = re.sub(
                  r'release\s*\{[^}]*signingConfig\s+signingConfigs\.debug[^}]*\}',
                  '''release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }''',
                  content,
                  flags=re.DOTALL
              )
          
              # Если не нашли signingConfig debug — добавим release buildType
              if "signingConfig signingConfigs.release" not in content:
                  content = content.replace(
                      "buildTypes {",
                      "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false\n            shrinkResources false\n        }",
                      1
                  )
          
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
          
              print("=== Пропатченный build.gradle ===")
              print(content)
          PYEOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate launcher icons
        run: |
          if [ -f "assets/icon/app_icon.png" ]; then
            echo "🎨 Генерирую иконки..."
            flutter pub run flutter_launcher_icons
          else
            echo "⚠️ Нет assets/icon/app_icon.png — пропускаю генерацию иконок"
          fi
      
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      
      - name: Rename APKs
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/vmeste-armeabi-v7a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/vmeste-arm64-v8a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/vmeste-x86_64.apk 2>/dev/null || true
          ls -la release/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vmeste-apk
          path: release/*.apk
          retention-days: 30
      
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}