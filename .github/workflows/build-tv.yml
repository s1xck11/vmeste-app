name: Build TV Launcher (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['tv-v*']

jobs:
  build:
    # НЕ windows-latest: там Server 2025 без Windows 10 SDK,
    # который нужен Flutter 3.22 → ошибка генератора VS 2019.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: tv

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Set version from run number
        shell: bash
        run: |
          NEW_VERSION="1.0.${{ github.run_number }}"
          sed -i "s|^version: .*|version: $NEW_VERSION+${{ github.run_number }}|" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Copy shared code from main app
        shell: bash
        run: |
          mkdir -p lib/models lib/services
          cp ../lib/models/*.dart lib/models/
          cp ../lib/supabase_config.dart lib/
          cp ../lib/services/budget_service.dart lib/services/
          echo "=== models ==="
          ls lib/models

      - name: Download Inter font
        shell: bash
        run: |
          mkdir -p assets/fonts
          curl -L --fail -o assets/fonts/Inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          ls -la assets/fonts

      - name: Create Windows project files
        run: flutter create --org com.vmeste --project-name vmeste_tv --platforms windows --no-pub .

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath VmesteTV-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VmesteTV-windows
          path: tv/VmesteTV-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/tv-v')
        uses: softprops/action-gh-release@v2
        with:
          files: tv/VmesteTV-windows.zip
