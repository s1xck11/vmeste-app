name: vmeste_hub
description: Вместе Хаб — домашний центр управления для планшета
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  http: ^1.2.1
  connectivity_plus: ^6.0.0
  intl: ^0.19.0
  timezone: ^0.9.4
  uuid: ^4.4.0

  # Приложения
  flutter_device_apps: ^0.8.1
  permission_handler: ^11.3.0

  # Криптография (для Tuya)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0E0C0D"
  adaptive_icon_foreground: "assets/icon/app_icon.png"